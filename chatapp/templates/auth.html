{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Favicon -->
    <link rel="icon" href="{% static 'image/favicon.ico' %}" />
    <!-- Custom CSS -->
    <link rel="stylesheet" href="{% static 'css/style_auth.css' %}" />

    <script src="{% static 'script/script_auth.js' %}"></script>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css?family=Montserrat|Quicksand"
      rel="stylesheet"
    />

    <title>chatty</title>
</head>
<body background="{% static 'image/auth_back.jpg' %}" style='background-size:cover;'>
    <p><h1 style="text-align: center; color: #f9f7fb; margin-top: 5vh; font-size: 33px;">Chaliye baatein krte hai !!</h1></p>
    <div class="CompleteForm">
    
        <div class="form_1">
            <button id="TG_login" onclick="login_animate()">Log in</button>
            <button id="TG_signup" onclick="signup_animate()">Sign up</button>
        </div>
    
        <div id="login_1">
            <form action="login" method="post">
                {% csrf_token %}
                <input type="text" name="username" placeholder="Username" />
                <input type="password" name="password" placeholder="Password" />
                <input type="submit" name="action" value="Login" class="btn login"/>
                <hr/>
            </form>
        </div>
    
        <div id="signup_1">
            <form action="register" method="post">
                {% csrf_token %}
                <input type="text" name="first_name" placeholder="First Name" />
                <input type="text" name="last_name" placeholder="Last Name" />
                <input type="text" name="username" placeholder="Username" />
                <input type="text" name="email" placeholder="Email" />
                <input type="password" name="password1" placeholder="Password" />
                <input type="password" name="password2" placeholder="Confirm Password"/>
                <input type="submit" name="action" value="Signup" class="btn signup"/>
            </form>
        </div>
    </div>
</body>
</html>
